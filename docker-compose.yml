version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: dailzo-mysql
    environment:
      MYSQL_DATABASE: dailzo
      MYSQL_USER: dailzo
      MYSQL_PASSWORD: dailzo
      MYSQL_ROOT_PASSWORD: dailzo
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdailzo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
