version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dailzo-postgres
    environment:
      POSTGRES_DB: dailzo
      POSTGRES_USER: dailzo
      POSTGRES_PASSWORD: dailzo
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailzo -d dailzo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dailzo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
