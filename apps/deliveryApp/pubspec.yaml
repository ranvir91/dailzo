name: dailzo_partner
description: Flutter app for Dailzo delivery partners.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Run `dart run flutter_launcher_icons` after changing the source image to
# regenerate the Android launcher icon from it. This app only targets
# Android (see android/ — no ios/ directory), so only that platform is set.
flutter_launcher_icons:
  image_path: 'assets/branding/Dailzo_icon.png'
  android: true
